<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Policy - Insurance Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Apply for Insurance Policy</h1>
            <div class="user-info">
                <a th:href="@{/dashboard}" class="btn">Back to Dashboard</a>
            </div>
        </header>
        
        <nav class="navbar">
            <a th:href="@{/dashboard}" class="nav-btn">Dashboard</a>
            <a th:href="@{/apply-policy}" class="nav-btn active">Add Policy</a>
            <a th:href="@{/submit-claim}" class="nav-btn">Submit Claim</a>
            <a th:href="@{/notifications}" class="nav-btn">Notifications</a>
            <a th:href="@{/payment-history}" class="nav-btn">Payment History</a>
            <a th:href="@{/wallet}" class="nav-btn">Wallet</a>
        </nav>
        
        <div class="form-container">
            <form th:action="@{/apply-policy}" th:object="${policy}" method="post">
                <div class="form-group">
                    <label for="policyType">Policy Type:</label>
                    <select id="policyType" th:field="*{policyType}" required>
                        <option value="">Select Policy Type</option>
                        <option value="HEALTH">Health Insurance</option>
                        <option value="LIFE">Life Insurance</option>
                        <option value="VEHICLE">Vehicle Insurance</option>
                        <option value="HOME">Home Insurance</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="policyName">Policy Name:</label>
                    <input type="text" id="policyName" th:field="*{policyName}" required>
                </div>
                
                <div class="form-group">
                    <label for="premiumAmount">Premium Amount (₹):</label>
                    <input type="number" id="premiumAmount" th:field="*{premiumAmount}" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="coverageAmount">Coverage Amount (₹):</label>
                    <input type="number" id="coverageAmount" th:field="*{coverageAmount}" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate" th:field="*{startDate}" required>
                </div>
                
                <div class="form-group">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate" th:field="*{endDate}" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Submit Application</button>
            </form>
        </div>
    </div>
</body>
</html>
